OPENROUTER_FREE_MODELS = "qwen/qwen3-coder:free,minimax/minimax-m2.5:free,openai/gpt-oss-120b:free,nvidia/nemotron-3-super-120b-a12b:free,meta-llama/llama-3.3-70b-instruct:free,google/gemma-4-31b-it:free"
